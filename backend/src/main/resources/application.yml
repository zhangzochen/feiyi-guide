server:
  port: 8081
spring:
  datasource:
    url: jdbc:h2:mem:feiyi;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
app:
  llm:
    base-url: https://api.openai.com/v1
    api-key:
    model: gpt-4o-mini
    embedding-model: text-embedding-3-small
    embedding-enabled: false
  rag:
    top-k: 4
    min-score: 0.15
logging:
  level:
    com.feiyi: INFO